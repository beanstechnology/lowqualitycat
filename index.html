<style>
  :root{
    --bg:#000;--ink:#fff;--dim:#7f8a8a;
    --mg:#fa32d2;--cy:#04e6e9;--line:#25292b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);min-height:100%}
  body{
    font-family:"Courier New",Courier,monospace;
    display:flex;flex-direction:column;align-items:center;
    padding:36px 16px 60px;text-align:center;
    -webkit-font-smoothing:none;
  }
  .logo{width:min(280px,70vw);image-rendering:pixelated;margin-bottom:20px}

  h1{
    font-family:"Walter Turncoat",cursive;
    font-size:clamp(24px,6vw,40px);
    font-weight:normal;color:#fff;
    letter-spacing:2px;line-height:1.4;
  }
  h1 span{display:inline-block;margin:0 .35em}
  h1 span:nth-child(1){transform:rotate(-5deg) skewX(-4deg)}
  h1 span:nth-child(2){transform:rotate(3deg) translateY(6px) skewX(3deg);font-size:1.12em}
  h1 span:nth-child(3){transform:rotate(-2.5deg) translateY(-3px) skewX(-2deg);font-size:.94em}
  .cn{color:var(--dim);font-size:15px;letter-spacing:4px;margin-top:14px}

  /* side-by-side row */
  .row{
    margin-top:40px;display:flex;gap:48px;align-items:center;
    justify-content:center;flex-wrap:wrap;
  }

  /* the vault (small) */
  .vault-wrap{perspective:700px;cursor:pointer}
  .vault-label{
    font-size:12px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;
    margin-bottom:10px;
    text-shadow:-1.5px 0 var(--mg),1.5px 0 var(--cy);
  }
  svg.vault{width:min(170px,44vw);height:auto;display:block;margin:0 auto;overflow:visible}
  .ghost-m{stroke:var(--mg);opacity:.8}
  .ghost-c{stroke:var(--cy);opacity:.8}
  .white{stroke:#fff}
  .door{
    transform-origin:82% 50%;
    transition:transform .8s cubic-bezier(.6,-.2,.3,1);
  }
  .vault-wrap.open .door{transform:rotateY(100deg)}
  .inside-txt{
    opacity:0;fill:#fff;font-family:"Courier New",monospace;font-size:15px;
    letter-spacing:3px;transition:opacity .4s .4s;
  }
  .vault-wrap.open .inside-txt{opacity:1}
  .hint{color:var(--dim);font-size:10px;letter-spacing:2px;margin-top:8px}
  .vault-wrap:hover .vault{filter:drop-shadow(0 0 8px rgba(250,50,210,.35)) drop-shadow(0 0 8px rgba(4,230,233,.35))}

  /* CA block */
  .ca-block{display:flex;flex-direction:column;gap:12px;align-items:center}
  .ca-label{
    font-size:12px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;
    text-shadow:-1.5px 0 var(--mg),1.5px 0 var(--cy);
  }
  .ca code{
    display:block;border:1px solid var(--line);padding:10px 12px;font-size:10px;
    color:var(--dim);max-width:78vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .ca button{
    background:#000;border:2px solid #fff;color:#fff;
    box-shadow:-3px 0 0 var(--mg),3px 0 0 var(--cy);
    text-shadow:-1.5px 0 var(--mg),1.5px 0 var(--cy);
    font-family:inherit;font-size:12px;font-weight:bold;letter-spacing:2px;
    padding:10px 18px;cursor:pointer;text-transform:uppercase;margin-top:10px;
    transform:rotate(1.2deg);
  }
  .ca button:hover,.ca button:focus-visible{background:#fff;color:#000;text-shadow:none;outline:none}

  nav{margin-top:46px;font-size:13px;letter-spacing:2px;display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  nav a{color:var(--dim);text-decoration:none;text-transform:uppercase}
  nav a:hover,nav a:focus-visible{color:#fff;text-shadow:-1px 0 var(--mg),1px 0 var(--cy);outline:none}

  footer{margin-top:auto;padding-top:50px;color:var(--dim);font-size:11px;letter-spacing:2px}

  @media (prefers-reduced-motion:reduce){
    .door{transition:none}
    .inside-txt{transition:none}
  }
</style>
</head>

<script>
(function(){
  var vault=document.getElementById('vault');
  var opened=false;
  function open(){
    if(opened)return;opened=true;
    vault.classList.add('open');
    setTimeout(function(){location.href='memes.html';},1100);
  }
  vault.addEventListener('click',open);
  vault.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}
  });

  document.getElementById('ca-copy').onclick=function(){
    var t=document.getElementById('ca-text').textContent;
    var b=this;
    navigator.clipboard.writeText(t).then(function(){
      b.textContent='Copied';
      setTimeout(function(){b.textContent='Copy CA';},1200);
    });
  };
})();
</script>
